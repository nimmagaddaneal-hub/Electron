<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1e24"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee0c8"/>
      <stop offset="0.55" stop-color="#3aa8ff"/>
      <stop offset="1" stop-color="#b8a4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#5ee0c8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5ee0c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.36" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#9ff3e3"/>
      <stop offset="0.7" stop-color="#3aa8ff"/>
      <stop offset="1" stop-color="#2a5bd7"/>
    </radialGradient>
  </defs>
  <!-- macOS icon grid: 824px rounded square centered -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- meridian ring with longitude arcs -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="url(#ring)" stroke-width="34"/>
  <ellipse cx="512" cy="512" rx="110" ry="250" fill="none" stroke="url(#ring)" stroke-width="22" stroke-opacity="0.85"/>
  <!-- companion orb -->
  <circle cx="700" cy="330" r="74" fill="url(#orb)"/>
  <circle cx="700" cy="330" r="74" fill="none" stroke="#0b0c0f" stroke-width="16"/>
</svg>
